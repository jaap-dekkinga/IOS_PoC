name: Open iOS SDK PRs

# Manually triggered: takes the xcframework built by a "Build SDK" run and
# opens a PR with it in the selected iOS app repo(s).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build SDK run ID to take the xcframework from (empty = latest successful run on main)'
        required: false
        default: ''
      target:
        description: 'iOS repo(s) to open the PR in'
        type: choice
        options:
          - all
          - tuneurl_radio_app_ota
          - CYON
        default: all

permissions:
  actions: read
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve SDK build and targets
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      sha: ${{ steps.build.outputs.sha }}
      head_branch: ${{ steps.build.outputs.head_branch }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Resolve Build SDK run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -e
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml \
              --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful Build SDK run found on main"
              exit 1
            fi
          fi
          INFO=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,conclusion,workflowName)
          echo "$INFO"
          if [ "$(echo "$INFO" | jq -r .workflowName)" != "Build SDK" ]; then
            echo "::error::Run $RUN_ID is not a Build SDK run"
            exit 1
          fi
          if [ "$(echo "$INFO" | jq -r .conclusion)" != "success" ]; then
            echo "::error::Build SDK run $RUN_ID did not succeed"
            exit 1
          fi
          # artifacts expire after 30 days, so make sure it's still there
          ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "TuneURL.xcframework" and .expired == false)] | length')
          if [ "$ARTIFACT" = "0" ]; then
            echo "::error::Build SDK run $RUN_ID has no (unexpired) TuneURL.xcframework artifact. Pass the run_id of a more recent Build SDK run."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$INFO" | jq -r .headSha)" >> "$GITHUB_OUTPUT"
          echo "head_branch=$(echo "$INFO" | jq -r .headBranch)" >> "$GITHUB_OUTPUT"

      - name: Select target repos
        id: targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          ALL='[
            {"repo": "jaap-dekkinga/tuneurl_radio_app_ota", "xcframework_path": "Dependencies/TuneURL.xcframework"},
            {"repo": "jaap-dekkinga/CYON",                  "xcframework_path": "Dependencies/TuneURL.xcframework"}
          ]'
          if [ "$TARGET" = "all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '{include: .}')
          else
            MATRIX=$(echo "$ALL" | jq -c --arg t "$TARGET" '{include: [.[] | select(.repo | endswith("/" + $t))]}')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  # ──────────────────────────────────────────────────────────────────────────
  publish-to-ios-app:
    name: Open PR to ${{ matrix.repo }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      SDK_RUN_ID: ${{ needs.resolve.outputs.run_id }}
      SDK_SHA: ${{ needs.resolve.outputs.sha }}
      SDK_BRANCH: ${{ needs.resolve.outputs.head_branch }}
    steps:
      - name: Download xcframework artifact
        uses: actions/download-artifact@v5
        with:
          name: TuneURL.xcframework
          path: artifact
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Unzip xcframework
        run: |
          set -e
          cd artifact
          unzip -q TuneURL.xcframework.zip
          test -d TuneURL.xcframework || (echo "::error::xcframework missing after unzip" && exit 1)

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.IOS_REPO_TOKEN }}
          path: ios-app
          fetch-depth: 0

      - name: Replace xcframework in iOS repo
        run: |
          set -e
          DEST="ios-app/${{ matrix.xcframework_path }}"
          PARENT_DIR=$(dirname "$DEST")
          if [ ! -d "$PARENT_DIR" ]; then
            echo "::error::Destination parent dir does not exist in iOS repo: $PARENT_DIR"
            echo "Check xcframework_path in the matrix for ${{ matrix.repo }}"
            exit 1
          fi
          echo "Removing old xcframework at $DEST"
          rm -rf "$DEST"
          echo "Copying new xcframework"
          cp -R artifact/TuneURL.xcframework "$DEST"
          echo "New xcframework contents:"
          ls -la "$DEST"

      - name: Detect changes
        id: detect
        working-directory: ios-app
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit. SDK binary already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          git config user.name "tuneurl-sdk-bot"
          git config user.email "tuneurl-sdk-bot@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          set -e
          BRANCH="sdk-update/${SDK_SHA::7}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add "${{ matrix.xcframework_path }}"
          git commit -m "Update TuneURL SDK to ${SDK_SHA::7}" -m "Auto-generated from SDK repo commit ${SDK_SHA} (branch ${SDK_BRANCH}). Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SDK_SHA}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        working-directory: ios-app
        run: |
          set -e
          PR_TITLE="Update TuneURL SDK to ${SDK_SHA::7}"
          PR_BODY=$(printf 'Auto-generated from SDK repo commit %s (branch %s).\n\nSDK build: %s/%s/actions/runs/%s\n\nMerge after iOS CI passes.' \
            "$SDK_SHA" "$SDK_BRANCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SDK_RUN_ID")
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH; leaving it as-is."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body  "$PR_BODY" \
              --base  main \
              --head  "$BRANCH"
          fi
