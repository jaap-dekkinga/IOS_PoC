name: Build SDK

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - 'BuildFramework.sh'
      - '.github/workflows/build-sdk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-xcframework:
    name: Build TuneURL.xcframework
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Sanity-check Swift sources match new C ABI
        # Fail early with a clear message if the Swift edits weren't applied.
        # The new C library requires `ExtractFingerprint(..., emitVersion)` with 3 args
        # and `CompareFingerprints(fp1, fp2)` with 2 args. Catch the mismatch up front
        # rather than buried in a 10,000-line xcodebuild log.
        run: |
          set -e
          BAD=0

          echo "Checking for old-style 3-arg CompareFingerprints calls..."
          if grep -rn --include="*.swift" -E "CompareFingerprints\([^)]+,[^)]+,[^)]+\)" .; then
            echo "::error::Found CompareFingerprints() calls with 3 arguments. The new C ABI takes 2 args. Apply the SDK edits before building."
            BAD=1
          fi

          # Catch ExtractFingerprint with only 2 args (no FORMAT_VERSION_* in the call).
          # Multi-line aware via `grep -Pzo` would be ideal, but plain grep works for
          # the call patterns this codebase uses.
          echo "Checking for old-style 2-arg ExtractFingerprint calls..."
          MATCHES=$(grep -rn --include="*.swift" "ExtractFingerprint(" . || true)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! echo "$line" | grep -q "FORMAT_VERSION"; then
              # Not a slam-dunk — the version arg may be on the next line.
              # Print as a warning, not a hard failure.
              echo "::warning::Possible 2-arg ExtractFingerprint call (verify a version arg is present): $line"
            fi
          done <<< "$MATCHES"

          if [ "$BAD" -eq 1 ]; then
            exit 1
          fi
          echo "Swift call sites match new C ABI."

      - name: Install xcpretty for readable logs
        run: gem install xcpretty --no-document || sudo gem install xcpretty --no-document

      - name: Archive for iOS device
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "Build/Framework Products/TuneURL-iphoneos.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-iphoneos.log | xcpretty --color || {
              echo "::group::Last 200 lines of full xcodebuild log (errors usually here)"
              tail -n 200 xcodebuild-iphoneos.log
              echo "::endgroup::"
              echo "::group::All Swift/Clang errors in the log"
              grep -E "error:|warning: |FAILED" xcodebuild-iphoneos.log | head -n 100 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Archive for iOS simulator
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "Build/Framework Products/TuneURL-iphonesimulator.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-iphonesimulator.log | xcpretty --color || {
              echo "::group::Last 200 lines of full xcodebuild log"
              tail -n 200 xcodebuild-iphonesimulator.log
              echo "::endgroup::"
              echo "::group::All Swift/Clang errors in the log"
              grep -E "error:|warning: |FAILED" xcodebuild-iphonesimulator.log | head -n 100 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -framework "Build/Framework Products/TuneURL-iphoneos.xcarchive/Products/Library/Frameworks/TuneURL.framework" \
            -debug-symbols "$(pwd -P)/Build/Framework Products/TuneURL-iphoneos.xcarchive/dSYMs/TuneURL.framework.dSYM" \
            -framework "Build/Framework Products/TuneURL-iphonesimulator.xcarchive/Products/Library/Frameworks/TuneURL.framework" \
            -debug-symbols "$(pwd -P)/Build/Framework Products/TuneURL-iphonesimulator.xcarchive/dSYMs/TuneURL.framework.dSYM" \
            -output "Build/Framework Products/TuneURL.xcframework"

      - name: Verify xcframework structure
        run: |
          set -e
          XCF="Build/Framework Products/TuneURL.xcframework"
          test -d "$XCF" || (echo "::error::xcframework not produced" && exit 1)
          test -f "$XCF/Info.plist" || (echo "::error::Info.plist missing" && exit 1)
          echo "xcframework contents:"
          ls -la "$XCF"
          echo "Info.plist:"
          /usr/libexec/PlistBuddy -c "Print" "$XCF/Info.plist"

      - name: Verify both slices link cleanly
        run: |
          set -e
          XCF="Build/Framework Products/TuneURL.xcframework"
          for slice in "$XCF"/*/TuneURL.framework/TuneURL; do
            echo "=== $slice ==="
            file "$slice"
            otool -L "$slice"
            echo "Architectures:"
            lipo -info "$slice"
          done

      - name: Zip xcframework for download
        run: |
          cd "Build/Framework Products"
          zip -ry TuneURL.xcframework.zip TuneURL.xcframework

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v5
        with:
          name: TuneURL.xcframework
          path: Build/Framework Products/TuneURL.xcframework.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            xcodebuild-*.log
            Build/Framework Products/*.xcarchive
          retention-days: 7
          if-no-files-found: ignore

  smoke-test-cpp:
    name: Run C++ v2 smoke test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Locate smoke test source
        id: locate
        run: |
          SMOKE_SRC=$(find . -name "r2_smoke_test.cpp" -type f | head -n1)
          if [ -z "$SMOKE_SRC" ]; then
            echo "::error::r2_smoke_test.cpp not found"
            exit 1
          fi
          echo "smoke_src=$SMOKE_SRC" >> "$GITHUB_OUTPUT"
          CPP_DIR=$(find . -name "Fingerprint.cpp" -type f | head -n1 | xargs dirname)
          echo "cpp_dir=$CPP_DIR" >> "$GITHUB_OUTPUT"
          echo "Found smoke test at: $SMOKE_SRC"
          echo "C++ sources at: $CPP_DIR"

      - name: Compile smoke test
        # FastFourierTransform.cpp uses Apple's Accelerate framework (vDSP_*).
        # The Xcode project links Accelerate automatically via the project's
        # frameworks list; this standalone clang++ invocation has to do it
        # explicitly. The smoke test runs on the macOS runner host (not iOS).
        run: |
          set -e
          CPP_DIR="${{ steps.locate.outputs.cpp_dir }}"
          SMOKE_SRC="${{ steps.locate.outputs.smoke_src }}"
          clang++ -std=c++17 -O2 -Wall \
            -I"$CPP_DIR" \
            "$SMOKE_SRC" \
            "$CPP_DIR"/ArrayCoord.cpp \
            "$CPP_DIR"/ArrayRankFloat.cpp \
            "$CPP_DIR"/FastFourierTransform.cpp \
            "$CPP_DIR"/Fingerprint.cpp \
            "$CPP_DIR"/FingerprintManager.cpp \
            "$CPP_DIR"/FingerprintProperties.cpp \
            "$CPP_DIR"/FingerprintSimilarityComputer.cpp \
            "$CPP_DIR"/MapRankInteger.cpp \
            "$CPP_DIR"/PairManager.cpp \
            "$CPP_DIR"/QuickSortInteger.cpp \
            "$CPP_DIR"/RobustIntensityProcessor.cpp \
            "$CPP_DIR"/Spectrogram.cpp \
            "$CPP_DIR"/WindowFunction.cpp \
            -framework Accelerate \
            -o smoke_test

      - name: Run smoke test
        run: |
          set -o pipefail
          ./smoke_test 2>&1 | tee smoke_test.log
          if grep -q "^FAIL:" smoke_test.log; then
            echo "::error::C++ smoke test reported failures"
            exit 1
          fi
          echo "All smoke test assertions passed."

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-log
          path: smoke_test.log
          if-no-files-found: ignore

  publish-to-ios-app:
    name: Open PR to update iOS app SDK
    needs: [build-xcframework, smoke-test-cpp]
    # Only on pushes to main (not PRs, not manual runs against branches).
    # Avoids opening PRs for every feature branch build.
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # TEMPORARY for testing — remove the main-only restriction
    if: github.event_name == 'push'
    runs-on: macos-15

    env:
      # ── EDIT THESE TWO TO MATCH YOUR REPO ──
      IOS_REPO: jaap-dekkinga/tuneurl_radio_app_ota
      IOS_XCFRAMEWORK_PATH: Dependencies/TuneURL.xcframework
      # ───────────────────────────────────────

    steps:
      - name: Download xcframework artifact
        uses: actions/download-artifact@v5
        with:
          name: TuneURL.xcframework
          path: artifact

      - name: Unzip xcframework
        run: |
          set -e
          cd artifact
          unzip -q TuneURL.xcframework.zip
          test -d TuneURL.xcframework || (echo "::error::xcframework missing after unzip" && exit 1)

      - name: Checkout iOS app repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.IOS_REPO }}
          token: ${{ secrets.IOS_REPO_TOKEN }}
          path: ios-app
          # Need full history so we can branch and push.
          fetch-depth: 0

      - name: Replace xcframework in iOS repo
        run: |
          set -e
          DEST="ios-app/${IOS_XCFRAMEWORK_PATH}"
          PARENT_DIR=$(dirname "$DEST")

          if [ ! -d "$PARENT_DIR" ]; then
            echo "::error::Destination parent dir does not exist in iOS repo: $PARENT_DIR"
            echo "Check IOS_XCFRAMEWORK_PATH is correct for the iOS app repo layout."
            exit 1
          fi

          echo "Removing old xcframework at $DEST"
          rm -rf "$DEST"

          echo "Copying new xcframework"
          cp -R artifact/TuneURL.xcframework "$DEST"

          echo "New xcframework contents:"
          ls -la "$DEST"

      - name: Detect changes
        id: detect
        working-directory: ios-app
        run: |
          set -e
          # `git status` shows nothing if the xcframework is byte-identical
          # to what's already there — common when re-running CI on a no-op
          # SDK change.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit. SDK binary already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          git config user.name "tuneurl-sdk-bot"
          git config user.email "tuneurl-sdk-bot@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          set -e
          BRANCH="sdk-update/${GITHUB_SHA::7}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$BRANCH"
          git add "${IOS_XCFRAMEWORK_PATH}"
          git commit -m "Update TuneURL SDK to ${GITHUB_SHA::7}

          Auto-generated from SDK repo commit ${GITHUB_SHA}.
          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        working-directory: ios-app
        run: |
          set -e
          PR_TITLE="Update TuneURL SDK to ${GITHUB_SHA::7}"
          PR_BODY=$(cat <<EOF
          Auto-generated from [SDK commit ${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          - SDK repo: \`${GITHUB_REPOSITORY}\`
          - SDK commit: \`${GITHUB_SHA}\`
          - SDK build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Merge after iOS CI passes.
          EOF
          )

          # If a PR for this branch is already open (e.g., re-run), update it
          # in place rather than creating a duplicate.
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH; leaving it as-is."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
