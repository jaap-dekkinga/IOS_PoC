# Changes to IOS_PoC/.github/workflows/main.yml
# These are ADDITIONS to the existing file — do not replace anything that already works.
# Three targeted changes, described below with the exact insertion points.

# ═══════════════════════════════════════════════════════════════════════════════
# CHANGE 1 — Add concurrency guard (insert after line 3, before `jobs:`)
# Prevents two overlapping builds when commits land close together.
# ═══════════════════════════════════════════════════════════════════════════════

# ADD after the `on:` block, before `jobs:`:

concurrency:
  group: sdk-build-${{ github.ref }}
  cancel-in-progress: true


# ═══════════════════════════════════════════════════════════════════════════════
# CHANGE 2 — Fix the self-referencing path filter (line 13 in existing file)
# The existing paths filter references 'build-sdk.yml' but the file is 'main.yml'.
# ═══════════════════════════════════════════════════════════════════════════════

# REPLACE this line:
#   - '.github/workflows/build-sdk.yml'
# WITH:
#   - '.github/workflows/main.yml'


# ═══════════════════════════════════════════════════════════════════════════════
# CHANGE 3 — Add a test job between smoke-test-cpp and publish-to-ios-app
#
# The existing file has NO xcodebuild test step at all.
# Add this new job. It runs in parallel with smoke-test-cpp, and
# publish-to-ios-app's `needs:` array should be updated to include it.
# ═══════════════════════════════════════════════════════════════════════════════

# ADD this job after the `smoke-test-cpp` job block:

  test-simulator:
    name: Run SDK tests (simulator)
    runs-on: macos-15
    # Run in parallel with smoke-test-cpp — both gate publish-to-ios-app.
    # No dependency on build-xcframework: testing against the workspace
    # source directly is faster and doesn't need the packaged xcframework.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document || sudo gem install xcpretty --no-document

      - name: Build for simulator (compile check)
        # Separate build step gives a clean error if the test target won't compile,
        # without wading through the longer test output.
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-sim-build.log | xcpretty --color || {
              echo "::group::Simulator build errors"
              grep -E "error:|FAILED" xcodebuild-sim-build.log | head -n 60 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Run tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log | xcpretty --color || {
              echo "::group::Test failures"
              grep -E "error:|FAILED|Test.*failed" xcodebuild-test.log | head -n 80 || true
              echo "::endgroup::"
              exit 1
            }
        # NOTE: If the SDK has no test target yet, xcodebuild exits non-zero with
        # "does not contain a test target". Add a Unit Testing Bundle target in
        # Xcode (File → New → Target → Unit Testing Bundle) to make this step active.
        # Until then, you can add `|| true` above to keep CI green while the test
        # target is being set up — but remove it once real tests exist.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sdk-test-results-${{ github.sha }}
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: sim-build-log
          path: xcodebuild-sim-build.log
          retention-days: 7
          if-no-files-found: ignore


# ═══════════════════════════════════════════════════════════════════════════════
# CHANGE 4 — Update publish-to-ios-app to also target pp_turl_iOS
#
# The existing job only updates tuneurl_radio_app_ota.
# Use a matrix to update both app repos in parallel from the same artifact.
# ═══════════════════════════════════════════════════════════════════════════════

# REPLACE the existing `publish-to-ios-app` job with this matrix version.
# The only functional differences from the existing job are:
#   1. `needs:` now includes `test-simulator`
#   2. A matrix drives two repos instead of hardcoded env vars
#   3. IOS_XCFRAMEWORK_PATH is per-repo (the two repos may store the
#      xcframework at different paths — adjust as needed)

  publish-to-ios-app:
    name: Open PR → ${{ matrix.repo }}
    needs: [build-xcframework, smoke-test-cpp, test-simulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15

    strategy:
      fail-fast: false   # if one app PR fails, still try the other
      matrix:
        include:
          - repo: jaap-dekkinga/tuneurl_radio_app_ota
            xcframework_path: Dependencies/TuneURL.xcframework
          - repo: jaap-dekkinga/pp_turl_iOS
            xcframework_path: Dependencies/TuneURL.xcframework
            # ↑ Adjust xcframework_path to match where pp_turl_iOS
            #   actually stores the framework (check the repo layout).

    steps:
      - name: Download xcframework artifact
        uses: actions/download-artifact@v5
        with:
          name: TuneURL.xcframework
          path: artifact

      - name: Unzip xcframework
        run: |
          set -e
          cd artifact
          unzip -q TuneURL.xcframework.zip
          test -d TuneURL.xcframework || (echo "::error::xcframework missing after unzip" && exit 1)

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.IOS_REPO_TOKEN }}
          path: ios-app
          fetch-depth: 0

      - name: Replace xcframework
        run: |
          set -e
          DEST="ios-app/${{ matrix.xcframework_path }}"
          PARENT_DIR=$(dirname "$DEST")
          if [ ! -d "$PARENT_DIR" ]; then
            echo "::error::Destination parent dir does not exist: $PARENT_DIR"
            echo "Check xcframework_path in the matrix for ${{ matrix.repo }}"
            exit 1
          fi
          rm -rf "$DEST"
          cp -R artifact/TuneURL.xcframework "$DEST"
          echo "Updated xcframework at $DEST"
          ls -la "$DEST"

      - name: Detect changes
        id: detect
        working-directory: ios-app
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — SDK already up to date in ${{ matrix.repo }}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          git config user.name "tuneurl-sdk-bot"
          git config user.email "tuneurl-sdk-bot@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          set -e
          BRANCH="sdk-update/${GITHUB_SHA::7}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add "${{ matrix.xcframework_path }}"
          git commit -m "Update TuneURL SDK to ${GITHUB_SHA::7}

Auto-generated from SDK repo commit ${GITHUB_SHA}.
Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        working-directory: ios-app
        run: |
          set -e
          PR_TITLE="Update TuneURL SDK to ${GITHUB_SHA::7}"
          PR_BODY=$(cat <<EOF
Auto-generated from [SDK commit ${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

- SDK repo: \`${GITHUB_REPOSITORY}\`
- SDK commit: \`${GITHUB_SHA}\`
- SDK build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

Merge after iOS CI passes.
EOF
)
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH; leaving it as-is."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body  "$PR_BODY" \
              --base  main \
              --head  "$BRANCH"
          fi
