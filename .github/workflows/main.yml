name: Build & Test SDK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - 'TuneURL/**'
      - 'TuneURLTests/**'
      - 'TuneURL.xcworkspace/**'
      - 'Podfile*'

concurrency:
  group: sdk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-xcframework:
    name: Build xcframework
    runs-on: macos-15
    outputs:
      artifact-name: TuneURL.xcframework
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          cd TuneURL
          pod install || pod update

      - name: Build xcframework
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (Framework)" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TuneURL-iphoneos.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-iphoneos.log

          xcodebuild archive \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (Framework)" \
            -configuration Release \
            -sdk iphonesimulator \
            -archivePath build/TuneURL-simulator.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-simulator.log

          xcodebuild -create-xcframework \
            -framework build/TuneURL-iphoneos.xcarchive/Products/Library/Frameworks/TuneURL.framework \
            -framework build/TuneURL-simulator.xcarchive/Products/Library/Frameworks/TuneURL.framework \
            -output build/TuneURL.xcframework

      - name: Verify xcframework
        run: |
          test -d build/TuneURL.xcframework || (echo "::error::xcframework not created" && exit 1)
          ls -lah build/TuneURL.xcframework

      - name: Create artifact
        run: |
          cd build
          zip -r TuneURL.xcframework.zip TuneURL.xcframework
          ls -lh TuneURL.xcframework.zip

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v5
        with:
          name: TuneURL.xcframework
          path: build/TuneURL.xcframework.zip
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            xcodebuild-iphoneos.log
            xcodebuild-simulator.log
          retention-days: 7

  smoke-test-cpp:
    name: C++ smoke tests
    runs-on: macos-15
    needs: build-xcframework
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Build C++ fingerprint library
        run: |
          cd TuneURL/FingerPrinting
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Run C++ tests
        run: |
          cd TuneURL/FingerPrinting/build
          ctest --output-on-failure || exit 1

  test-simulator:
    name: Run SDK tests (simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document || sudo gem install xcpretty --no-document

      - name: Build for simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-sim-build.log | xcpretty --color || {
              echo "::group::Simulator build errors"
              grep -E "error:|FAILED" xcodebuild-sim-build.log | head -n 60 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Run tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace TuneURL.xcworkspace \
            -scheme "TuneURL (SDK)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log | xcpretty --color || {
              echo "::group::Test failures"
              grep -E "error:|FAILED|Test.*failed" xcodebuild-test.log | head -n 80 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sdk-test-results-${{ github.sha }}
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: sim-build-log
          path: xcodebuild-sim-build.log
          retention-days: 7
          if-no-files-found: ignore

  publish-to-ios-app:
    name: Open PR → ${{ matrix.repo }}
    needs: [build-xcframework, smoke-test-cpp, test-simulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: jaap-dekkinga/tuneurl_radio_app_ota
            xcframework_path: Dependencies/TuneURL.xcframework
          - repo: jaap-dekkinga/pp_turl_iOS
            xcframework_path: Dependencies/TuneURL.xcframework

    steps:
      - name: Download xcframework artifact
        uses: actions/download-artifact@v5
        with:
          name: TuneURL.xcframework
          path: artifact

      - name: Unzip xcframework
        run: |
          set -e
          cd artifact
          unzip -q TuneURL.xcframework.zip
          test -d TuneURL.xcframework || (echo "::error::xcframework missing after unzip" && exit 1)

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.IOS_REPO_TOKEN }}
          path: ios-app
          fetch-depth: 0

      - name: Replace xcframework
        run: |
          set -e
          DEST="ios-app/${{ matrix.xcframework_path }}"
          PARENT_DIR=$(dirname "$DEST")
          if [ ! -d "$PARENT_DIR" ]; then
            echo "::error::Destination parent dir does not exist: $PARENT_DIR"
            echo "Check xcframework_path in the matrix for ${{ matrix.repo }}"
            exit 1
          fi
          rm -rf "$DEST"
          cp -R artifact/TuneURL.xcframework "$DEST"
          echo "Updated xcframework at $DEST"
          ls -la "$DEST"

      - name: Detect changes
        id: detect
        working-directory: ios-app
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — SDK already up to date in ${{ matrix.repo }}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          git config user.name "tuneurl-sdk-bot"
          git config user.email "tuneurl-sdk-bot@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.detect.outputs.changed == 'true'
        working-directory: ios-app
        run: |
          set -e
          BRANCH="sdk-update/${GITHUB_SHA::7}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add "${{ matrix.xcframework_path }}"
          git commit -m "Update TuneURL SDK to ${GITHUB_SHA::7}

Auto-generated from SDK repo commit ${GITHUB_SHA}.
Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.IOS_REPO_TOKEN }}
        working-directory: ios-app
        run: |
          set -e
          PR_TITLE="Update TuneURL SDK to ${GITHUB_SHA::7}"
          PR_BODY=$(cat <<EOF
Auto-generated from [SDK commit ${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

- SDK repo: \`${GITHUB_REPOSITORY}\`
- SDK commit: \`${GITHUB_SHA}\`
- SDK build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

Merge after iOS CI passes.
EOF
)
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH; leaving it as-is."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body  "$PR_BODY" \
              --base  main \
              --head  "$BRANCH"
          fi
